services:
  mongo:
    build:
      context: ./mongo-docker
      dockerfile: Dockerfile
    image: ateneo-mongo:local
    container_name: ateneo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
      - --keyFile
      - /etc/mongo/keyfile
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - -u
        - ${DB_USER}
        - -p
        - ${DB_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - "try { rs.status() } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; quit(rs.status().myState === 1 ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${DB_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${DB_PASSWORD}
      ME_CONFIG_MONGODB_URL: ${DB_MONGO_URI}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
